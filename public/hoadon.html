<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hóa đơn sỉ - MiMi Shop Hoa Lụa</title>
<style>
  :root {
    --bg: #f6f1e8; --surface: #fffdf8; --surface-2: #f3ebdf; --ink: #1c1915;
    --muted: #6f655c; --primary: #7c3527; --primary-fg: #fff8f3; --line: #e4d5c3;
    --gold: #a68456; --ok: #1f7a4d; --ok-bg: #e7f6ee; --warn: #9a5416; --warn-bg: #fff4e8;
    --danger: #9b2c2c; --danger-bg: #fdecec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.45 "Be Vietnam Pro", "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px 16px 88px; }
  header.top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a { color: var(--primary); font-size: 13px; font-weight: 650; text-decoration: none; }
  .status { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--danger-bg); color: var(--danger); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
  .tabs button { height: 44px; border: 0; border-radius: 12px; background: transparent; padding: 0 14px; font-weight: 650; color: var(--muted); white-space: nowrap; }
  .tabs button.on { background: var(--primary); color: var(--primary-fg); }
  .grid { display: grid; gap: 12px; }
  .grid > *, .row > div { min-width: 0; }
  .sel { max-width: 100%; }
  @media (min-width: 900px) {
    .sell { grid-template-columns: minmax(0,1fr) 340px; align-items: start; }
    .sell > aside.card { position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow: auto; }
  }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .pad { padding: 12px; }
  .field, .area, .sel {
    width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); padding: 0 12px;
  }
  .area { height: auto; min-height: 52px; padding: 8px 12px; }
  label.lbl { display: block; font-size: 13px; color: var(--muted); font-weight: 650; margin: 8px 0 4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > .field, .row > .sel { flex: 1 1 140px; width: auto; min-width: 0; }
  .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { height: 44px; border: 0; border-radius: 12px; padding: 0 14px; font-weight: 700; background: var(--primary); color: var(--primary-fg); }
  .btn.soft { background: var(--surface-2); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.bad { background: var(--danger); color: var(--primary-fg); }
  .list { max-height: 68vh; overflow: auto; }
  .item, .order { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 10px 12px; }
  .item img, .ph { width: 44px; height: 44px; border-radius: 10px; object-fit: contain; background: var(--surface-2); flex: none; }
  .grow { min-width: 0; flex: 1; }
  .name { font-weight: 700; }
  .meta { color: var(--muted); font-size: 13px; }
  .right { text-align: right; }
  .cart-line { background: var(--surface-2); border-radius: 12px; padding: 10px; margin-top: 8px; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-bottom: 12px; }
  @media (min-width: 800px) { .stats { grid-template-columns: repeat(4, minmax(0,1fr)); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 14px; padding: 12px; }
  .stat b { display: block; font-size: 18px; margin-top: 2px; }
  .hidden { display: none !important; }
  .overlay { position: fixed; inset: 0; background: rgba(28,25,21,.45); z-index: 30; overflow: auto; padding: 12px; }
  .sheet { max-width: 860px; margin: 0 auto; background: var(--surface); border-radius: 16px; padding: 14px; }
  .toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--primary-fg); border-radius: 12px; padding: 10px 14px; z-index: 50; max-width: 90vw; }
  .invoice-paper { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 8px auto; }
  .invoice-paper[data-paper="a4"] { width: min(190mm, 100%); }
  .invoice-paper[data-paper="a6"] { width: min(105mm, 100%); font-size: 11px; padding: 8px; }
  .invoice-paper[data-paper="a7"] { width: min(74mm, 100%); font-size: 9px; padding: 6px; }
  .invoice-paper h2 { text-align: center; color: var(--primary); letter-spacing: .04em; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); padding: 8px 0; margin: 10px 0; }
  .invoice-paper table { width: 100%; border-collapse: collapse; }
  .invoice-paper th, .invoice-paper td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
  .invoice-paper th { background: var(--surface-2); }
  .num { text-align: right; }
  .mark { width: 58px; height: 58px; border-radius: 999px; border: 1px solid var(--primary); color: var(--primary); display: grid; place-items: center; text-align: center; font-size: 12px; flex: none; }
  .headrow { display: flex; gap: 10px; align-items: center; }
  .headrow h3 { margin: 0; color: var(--primary); }
  .headrow p { margin: 0; color: var(--muted); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .pay p { display: flex; justify-content: space-between; margin: 2px 0; }
  .qr { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .qr img { width: 92px; height: 92px; object-fit: contain; background: white; }
  .dock { display: none; }
  .zalo-shot { width: min(100%, 420px); height: auto; border-radius: 12px; background: white; box-shadow: 0 8px 28px rgba(28,25,21,.12); }
  @media (max-width: 899px) {
    .list { max-height: calc(100vh - 250px); }
    .dock.show { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 8px; align-items: center; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .sell > aside.card { display: none; }
    .sell > aside.card.open { display: block; position: fixed; z-index: 25; left: 8px; right: 8px; top: 64px; bottom: 76px; overflow: auto; }
  }
  @media print {
    body * { visibility: hidden; }
    #printSheet, #printSheet * { visibility: visible; }
    #printSheet { position: absolute; inset: 0; background: white; }
    .no-print { display: none !important; }
    .invoice-paper { border: 0; width: auto; }
    tr, .qr { break-inside: avoid; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="sub">Số 3, ngõ Văn Chi 1, thôn Phù Mã, xã Sóc Sơn · 034.821.1187</div>
      <h1>Hóa đơn sỉ</h1>
    </div>
    <div class="links">
      <a href="./admin.html">Quản lý</a>
      <a href="./khachsi.html">Bảng hàng sỉ</a>
      <a href="./admin_products_giasi.html">Kho sỉ</a>
      <a href="./">Cửa hàng</a>
    </div>
  </header>
  <div class="status">
    <span class="pill" id="cloudPill">Đang nối Firebase…</span>
    <span class="pill" id="countPill"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<div id="toast" class="toast hidden"></div>
<div id="modal" class="overlay hidden"></div>
<div id="printSheet" class="overlay hidden"></div>
<div id="dock" class="dock"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDT0IEKhjAJZ_ZiMVwVCvO-fuj0ByReoE8",
  authDomain: "esomar-vnn.firebaseapp.com",
  projectId: "esomar-vnn",
  storageBucket: "esomar-vnn.firebasestorage.app",
  messagingSenderId: "1023271897973",
  appId: "1:1023271897973:web:c7207b0e8321fc271fe13c",
  measurementId: "G-L078YGNJ3J"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const SHOP = {
  name: "MiMi Shop Hoa Lụa",
  address: "Số 3, ngõ Văn Chi 1, thôn Phù Mã, xã Sóc Sơn, TP Hà Nội",
  phone: "034.821.1187",
  web: "https://mimihoalua.github.io/mimihoalua/",
  cashier: "MiMi Shop",
  bank: "TECHCOMBANK",
  account: "19037189711011",
  owner: "NGUYEN THI THAM",
  note: "MIMI KHACH"
};

let products = [];
let orders = [];
let codes = [];
let tab = "sell";
let cart = {};
let qSell = "";
let qOrder = "";
let qProd = "";
let filter = "all";
let cloud = "Đang nối Firebase…";
let cloudOk = false;
let sellReady = false;
let draft = { clientName: "", pay: "Tiền mặt", ship: "0", vat: false, note: "" };
let saving = false;

const $ = (id) => document.getElementById(id);
const money = (n) => Math.round(Number(n) || 0).toLocaleString("vi-VN");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fold = (s) => String(s || "").normalize("NFD").replace(/\p{M}/gu, "").replace(/đ/g, "d").toLowerCase();
const hit = (blob, q) => { const f = fold(q).trim(); if (!f) return true; const b = fold(blob); return f.split(/\s+/).every((w) => b.includes(w)); };
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add("hidden"), 2800);
}
function vnParts(d) {
  const bag = {};
  new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Ho_Chi_Minh", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(d).forEach((part) => { bag[part.type] = part.value; });
  if (bag.hour === "24") bag.hour = "00";
  return bag;
}
function when(v) {
  if (!v) return "";
  const d = v.toDate ? v.toDate() : v.seconds ? new Date(v.seconds * 1000) : new Date(v);
  if (Number.isNaN(d.getTime())) return "";
  const b = vnParts(d);
  return `${b.day}/${b.month}/${b.year} ${b.hour}:${b.minute}`;
}
function todayKey() {
  const b = vnParts(new Date());
  return `${b.year}${b.month}${b.day}`;
}
function nextCode() {
  const prefix = "HD" + todayKey();
  let max = 0;
  orders.forEach((o) => {
    const id = String(o.orderId || "");
    if (!id.startsWith(prefix)) return;
    const n = parseInt(id.slice(prefix.length), 10);
    if (n > max) max = n;
  });
  return prefix + String(max + 1).padStart(4, "0");
}
function priceOf(p) { return Number(p.wholesale_price || p.price || 0); }
function imgOf(p) { return p.image || p.image_url || ""; }

function watch() {
  db.collection("wholesale_products").onSnapshot((snap) => {
    products = snap.docs.map((d) => ({ ...d.data(), docId: d.id })).sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "vi"));
    cloudOk = true;
    cloud = "Firebase esomar-vnn";
    paint();
  }, (err) => { cloudOk = false; cloud = "Không đọc được hàng: " + err.message; paint(); });

  const applyOrders = (snap) => {
    orders = snap.docs.map((d) => ({ ...d.data(), docId: d.id, orderId: d.data().orderId || d.id }));
    orders.sort((a, b) => (b.localTimestamp || 0) - (a.localTimestamp || 0) || String(b.orderId).localeCompare(String(a.orderId)));
    paint();
  };
  db.collection("wholesale_orders").orderBy("createdAt", "desc").limit(400).onSnapshot(applyOrders, () => {
    db.collection("wholesale_orders").limit(400).onSnapshot(applyOrders, (err) => toast(err.message));
  });
  db.collection("access_codes").onSnapshot((snap) => {
    codes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    codes.sort((a, b) => String(a.clientName || "").localeCompare(String(b.clientName || ""), "vi"));
    if (tab === "codes" || tab === "sell") paint();
  }, (err) => toast("Mã khách: " + err.message));
}

function paint() {
  $("cloudPill").textContent = cloud;
  $("cloudPill").className = "pill " + (cloudOk ? "ok" : "warn");
  const open = orders.filter((o) => o.status === "new").length;
  $("countPill").textContent = `${products.length} hàng · ${orders.length} đơn · ${open} chờ chốt`;
  const tabs = [["sell", "Bán"], ["orders", "Hóa đơn"], ["goods", "Hàng"], ["codes", "Mã khách"], ["txt", "Nhập TXT"]];
  $("tabs").innerHTML = tabs.map(([id, label]) => `<button type="button" class="${tab === id ? "on" : ""}" data-tab="${id}">${label}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; sellReady = false; paint(); });
  syncDock();
  if (tab === "sell" && sellReady && $("productList")) {
    fillProducts();
    fillCodes();
    renderCart();
    if (window.__updateTotals) window.__updateTotals();
    syncDock();
    return;
  }
  if (tab === "sell") renderSell();
  else if (tab === "orders" && $("modal").classList.contains("hidden")) renderOrders();
  else if (tab === "orders") { /* giữ phiếu đang mở */ }
  else if (tab === "goods" && $("modal").classList.contains("hidden")) renderGoods();
  else if (tab === "codes" && $("modal").classList.contains("hidden")) renderCodes();
  else if (tab === "txt" && !$("txt")) renderTxt();
}

function renderSell() {
  const root = $("view");
  root.innerHTML = `
    <div class="grid sell">
      <section class="card">
        <div class="pad"><input class="field" id="qSell" placeholder="Tìm tên hoặc mã hàng" value="${esc(qSell)}"></div>
        <div class="list" id="productList"></div>
      </section>
      <aside class="card pad">
        <strong>Giỏ hóa đơn</strong>
        <div id="cartBox"></div>
        <label class="lbl">Khách</label>
        <input class="field" id="clientName" list="codeList" placeholder="Tên khách hoặc chọn mã" value="${esc(draft.clientName)}">
        <datalist id="codeList"></datalist>
        <div class="row">
          <div style="flex:1"><label class="lbl">Ship</label><input class="field" id="ship" value="${esc(draft.ship)}"></div>
          <div style="flex:1"><label class="lbl">Thanh toán</label>
            <select class="sel" id="pay">
              <option ${draft.pay === "Tiền mặt" ? "selected" : ""}>Tiền mặt</option>
              <option ${draft.pay === "Chuyển khoản" ? "selected" : ""}>Chuyển khoản</option>
              <option ${draft.pay === "qr" ? "selected" : ""}>qr</option>
            </select>
          </div>
        </div>
        <label class="row" style="margin-top:8px"><input type="checkbox" id="vat" ${draft.vat ? "checked" : ""}> Tính VAT 8%</label>
        <label class="lbl">Ghi chú</label>
        <textarea class="area" id="note">${esc(draft.note)}</textarea>
        <div class="row" style="justify-content:space-between;margin-top:8px"><span>Tiền hàng</span><b id="subLab"></b></div>
        <div class="row" style="justify-content:space-between"><span>Cần thu</span><b id="totalLab"></b></div>
        <p class="meta">Lưu đơn chờ không trừ tồn. Chốt và in sẽ trừ tồn.</p>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="saveNew" type="button">Lưu đơn chờ</button>
          <button class="btn soft" id="saveDone" type="button">Chốt và in</button>
          <button class="btn ghost" id="previewBill" type="button">Xem phiếu</button>
          <button class="btn" id="zaloDraft" type="button">Ảnh Zalo</button>
        </div>
      </aside>
    </div>`;
  $("qSell").oninput = (e) => { qSell = e.target.value; fillProducts(); };
  $("clientName").oninput = (e) => { draft.clientName = e.target.value; };
  $("ship").oninput = () => { draft.ship = $("ship").value; updateTotals(); };
  $("pay").onchange = () => { draft.pay = $("pay").value; };
  $("vat").onchange = () => { draft.vat = $("vat").checked; updateTotals(); };
  $("note").oninput = () => { draft.note = $("note").value; };
  $("saveNew").onclick = () => saveOrder("new", false);
  $("saveDone").onclick = () => saveOrder("completed", true);
  $("previewBill").onclick = () => {
    if (!Object.keys(cart).length) return toast("Chưa có hàng.");
    openPrint(draftOrder(), "a4");
  };
  $("zaloDraft").onclick = () => {
    if (!Object.keys(cart).length) return toast("Chưa có hàng.");
    showZalo(draftOrder());
  };
  sellReady = true;
  fillCodes();
  fillProducts();
  renderCart();
  updateTotals();
  function updateTotals() {
    const subNow = Object.values(cart).reduce((s, l) => s + l.qty * l.price, 0);
    const ship = Math.max(0, parseInt(String($("ship").value).replace(/\D/g, ""), 10) || 0);
    const vat = $("vat").checked ? Math.round(subNow * 0.08) : 0;
    $("subLab").textContent = money(subNow) + " đ";
    $("totalLab").textContent = money(subNow + ship + vat) + " đ";
    syncDock();
  }
  window.__updateTotals = updateTotals;
}

function fillCodes() {
  const list = $("codeList");
  if (!list) return;
  list.innerHTML = codes.map((c) => `<option value="${esc(c.clientName || c.id)}">${esc(c.id)} · ${esc(c.clientName || "")}</option>`).join("");
}

function fillProducts() {
  const box = $("productList");
  if (!box) return;
  const rows = products.filter((p) => p.isActive !== false && hit(`${p.name} ${p.sku} ${p.category}`, qSell)).slice(0, 80);
  if (!rows.length) {
    const msg = !cloudOk ? "Đang tải hàng từ Firebase…" : (qSell ? "Không thấy hàng." : "Kho chưa có hàng.");
    box.innerHTML = `<div class="pad meta">${msg}</div>`;
    return;
  }
  box.innerHTML = rows.map((p) => `
    <button type="button" class="item" data-add="${esc(p.docId)}">
      ${imgOf(p) ? `<img alt="" src="${esc(imgOf(p))}">` : `<span class="ph"></span>`}
      <span class="grow"><span class="name">${esc(p.name)}</span><span class="meta">${esc(p.sku || "")} · tồn ${esc(p.stock ?? 0)}</span></span>
      <span class="right"><span class="meta">Gợi ý</span><b>${money(priceOf(p))}</b></span>
    </button>`).join("");
  box.querySelectorAll("[data-add]").forEach((btn) => btn.onclick = () => addCart(btn.dataset.add));
}
function addCart(docId) {
  const p = products.find((x) => x.docId === docId);
  if (!p) return;
  if (cart[p.docId]) {
    cart[p.docId].qty += 1;
    renderCart();
    if (window.__updateTotals) window.__updateTotals();
    toast("Đã tăng số lượng. Giá giữ như đã nhập.");
    return;
  }
  openPriceSheet(p);
}
function openPriceSheet(p) {
  const suggest = priceOf(p);
  $("modal").classList.remove("hidden");
  $("modal").innerHTML = `<div class="sheet">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(p.name)}</h2><button class="btn ghost" id="xPrice" type="button">Đóng</button></div>
    <p class="meta">${esc(p.sku || "")} · tồn ${esc(p.stock ?? 0)}</p>
    <p>Gợi ý giá shop: <b>${money(suggest)} đ</b></p>
    <label class="lbl">Giá bán (tự nhập)</label>
    <input class="field" id="askPrice" inputmode="numeric" placeholder="Nhập giá bán" autocomplete="off">
    <button class="btn soft" id="useSuggest" type="button" style="margin-top:8px">Điền gợi ý ${money(suggest)}</button>
    <label class="lbl">Số lượng</label>
    <input class="field" id="askQty" inputmode="numeric" value="1">
    <button class="btn" id="confirmAdd" type="button" style="margin-top:12px;width:100%">Thêm vào hóa đơn</button>
  </div>`;
  $("xPrice").onclick = () => $("modal").classList.add("hidden");
  $("askPrice").focus();
  $("useSuggest").onclick = () => { $("askPrice").value = money(suggest); $("askPrice").focus(); };
  $("confirmAdd").onclick = () => {
    const price = parseInt($("askPrice").value.replace(/\D/g, ""), 10) || 0;
    if (!price) return toast("Nhập giá bán. Gợi ý shop chỉ để tham khảo.");
    const qty = Math.max(1, parseInt($("askQty").value, 10) || 1);

async function adjustStock(lines, sign) {
  const byDoc = {};
  for (const line of lines) {
    const qty = Number(line.qty ?? line.quantity) || 0;
    if (!qty) continue;
    const p = products.find((x) => (line.docId && x.docId === line.docId) || (line.sku && x.sku === line.sku));
    if (!p) continue;
    if (!byDoc[p.docId]) byDoc[p.docId] = { docId: p.docId, stock: parseInt(p.stock, 10) || 0, qty: 0 };
    byDoc[p.docId].qty += qty;
  }
  for (const row of Object.values(byDoc)) {
    const stock = Math.max(0, row.stock + sign * row.qty);
    await db.collection("wholesale_products").doc(row.docId).set({ stock, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    const live = products.find((x) => x.docId === row.docId);
    if (live) live.stock = stock;
  }
}
function deductStock(lines) { return adjustStock(lines, -1); }
function restoreStock(lines) { return adjustStock(lines, 1); }

function wrapLines(ctx, text, maxW) {
  const words = String(text || "").split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = "";
  for (const word of words) {
    const next = cur ? cur + " " + word : word;
    if (ctx.measureText(next).width > maxW && cur) { lines.push(cur); cur = word; }
    else cur = next;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [""];
}

    if (i % 2 === 0) { ctx.fillStyle = "#fbf7f1"; ctx.fillRect(48, y, W - 96, h); }
    ctx.fillStyle = "#1c1915";
    ctx.font = "600 28px 'Be Vietnam Pro', sans-serif";
    lines.forEach((line, li) => ctx.fillText((li === 0 ? (i + 1) + ". " : "") + line, 64, y + 40 + li * 38));
    ctx.font = "600 26px 'Be Vietnam Pro', sans-serif";
    ctx.textAlign = "right";
    const mid = y + 40;
    ctx.fillText(String(it.quantity), 690, mid);
    ctx.fillText(money(it.price), 860, mid);
    ctx.fillText(money(Number(it.quantity) * Number(it.price)), W - 56, mid);
    ctx.textAlign = "left";
    y += h;
  });
  y += 36;
  ctx.font = "500 28px 'Be Vietnam Pro', sans-serif";
  ctx.fillStyle = "#1c1915";
  [["Tiền hàng", o.subTotal || 0], ["Ship", o.shippingFee || 0], ["VAT", o.vatFee || 0]].forEach(([label, value]) => {
    ctx.textAlign = "left";
    ctx.fillText(label, 560, y);
    ctx.textAlign = "right";
    ctx.fillText(money(value), W - 56, y);
    y += 42;
  });
  ctx.fillStyle = "#7c3527";
  ctx.font = "700 36px 'Be Vietnam Pro', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Tổng thanh toán", 430, y + 6);
  ctx.textAlign = "right";
  ctx.fillText(money(amount) + " đ", W - 56, y + 6);
  ctx.textAlign = "left";
  y += 52;
  ctx.fillStyle = "#6f655c";
  ctx.font = "500 26px 'Be Vietnam Pro', sans-serif";
  ctx.fillText(o.paymentMethod || "", 560, y);
  y += 40;
  noteLines.forEach((line) => { ctx.fillText(line, 56, y); y += 34; });
  y += 12;
  const qr = await loadImage(qrUrl(o.orderId, amount));
  if (qr) ctx.drawImage(qr, 56, y, 280, 280);
  else { ctx.strokeStyle = "#e4d5c3"; ctx.strokeRect(56, y, 280, 280); }
  ctx.fillStyle = "#1c1915";
  ctx.font = "700 30px 'Be Vietnam Pro', sans-serif";
  ctx.fillText("Chuyển khoản", 360, y + 48);
  ctx.font = "500 28px 'Be Vietnam Pro', sans-serif";
  ctx.fillText(SHOP.bank, 360, y + 96);
  ctx.fillText("STK: " + SHOP.account, 360, y + 140);
  ctx.fillText(SHOP.owner, 360, y + 184);
  const memo = wrapLines(ctx, "Nội dung: " + SHOP.note + " " + (o.orderId || ""), 640);
  memo.forEach((line, i) => ctx.fillText(line, 360, y + 232 + i * 34));
  y += 340;
  ctx.fillStyle = "#7c3527";
  ctx.font = "600 28px 'Be Vietnam Pro', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Xin cảm ơn Quý khách đã mua hàng", W / 2, Math.min(y, H - 70));
  ctx.fillStyle = "#6f655c";
  ctx.font = "500 24px 'Be Vietnam Pro', sans-serif";
  ctx.fillText(SHOP.name, W / 2, Math.min(y + 38, H - 32));
  return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
}
async function showZalo(o) {
  if (!(o.items || []).length) return toast("Chưa có hàng.");
  $("modal").classList.remove("hidden");
  $("modal").innerHTML = `<div class="sheet" style="text-align:center"><p>Đang tạo ảnh gửi Zalo…</p></div>`;
  try {
    const blob = await invoiceBlob(o);
    if (!blob) throw new Error("Không tạo được ảnh");
    const url = URL.createObjectURL(blob);
    const file = new File([blob], "HoaDon-" + (o.orderId || "mimi") + ".png", { type: "image/png" });
    $("modal").innerHTML = `<div class="sheet" style="text-align:center">
      <div class="row" style="justify-content:space-between"><strong>Ảnh gửi khách</strong><button class="btn ghost" id="xZalo" type="button">Đóng</button></div>
      <p class="meta">Bấm Gửi Zalo để chọn Zalo. Hoặc nhấn giữ ảnh để lưu.</p>
      <img class="zalo-shot" alt="Hóa đơn" src="${url}">
      <div class="row" style="margin-top:12px;justify-content:center">
        <button class="btn" id="shareZalo" type="button">Gửi Zalo</button>
        <button class="btn soft" id="saveZalo" type="button">Tải ảnh</button>
      </div>
    </div>`;
    $("xZalo").onclick = () => { URL.revokeObjectURL(url); $("modal").classList.add("hidden"); };
    $("saveZalo").onclick = () => { const a = document.createElement("a"); a.href = url; a.download = file.name; a.click(); };
    $("shareZalo").onclick = async () => {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "Hóa đơn " + (o.orderId || ""), text: SHOP.name + " - " + (o.clientName || "") }); }
        catch (err) { if (err.name !== "AbortError") toast(err.message); }
      } else {
        $("saveZalo").click();
        toast("Đã tải ảnh. Mở Zalo và gửi file này.");
      }
    };
  } catch (err) {
    $("modal").classList.add("hidden");
    toast(err.message || "Không tạo được ảnh");
  }
}

function editProduct(p) {
  $("modal").classList.remove("hidden");
  const v = p || { name: "", sku: "", category: "Hoa lụa", price: 0, stock: 0, image: "", color: "", weight: "", description: "" };
  $("modal").innerHTML = `<div class="sheet">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${p ? "Sửa hàng" : "Thêm hàng"}</h2><button class="btn ghost" id="x" type="button">Đóng</button></div>
    <label class="lbl">Tên</label><input class="field" id="mName" value="${esc(v.name)}">
    <div class="row"><div style="flex:1"><label class="lbl">SKU</label><input class="field" id="mSku" value="${esc(v.sku || "")}"></div><div style="flex:1"><label class="lbl">Nhóm</label><input class="field" id="mCat" value="${esc(v.category || "")}"></div></div>
    <div class="row"><div style="flex:1"><label class="lbl">Giá sỉ</label><input class="field" id="mPrice" value="${money(priceOf(v))}"></div><div style="flex:1"><label class="lbl">Tồn</label><input class="field" id="mStock" value="${esc(v.stock ?? 0)}"></div></div>
    <label class="lbl">Ảnh</label><input class="field" id="mImg" value="${esc(imgOf(v))}">
    <label class="lbl">Màu / khối lượng</label><div class="row"><input class="field" id="mColor" value="${esc(v.color || "")}"><input class="field" id="mWeight" value="${esc(v.weight || "")}"></div>
    <label class="lbl">Mô tả</label><textarea class="area" id="mDesc">${esc(v.description || "")}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="saveP" type="button">Lưu</button>${p ? `<button class="btn bad" id="delP" type="button">Xóa</button>` : ""}</div>
  </div>`;
  $("x").onclick = () => $("modal").classList.add("hidden");
  $("saveP").onclick = async () => {
    const name = $("mName").value.trim();
    if (!name) return toast("Cần tên hàng");
    const price = parseInt($("mPrice").value.replace(/\D/g, ""), 10) || 0;
    const data = {
      name, sku: $("mSku").value.trim(), category: $("mCat").value.trim() || "Hoa lụa",
      price, wholesale_price: price, stock: parseInt($("mStock").value, 10) || 0,
      image: $("mImg").value.trim(), image_url: $("mImg").value.trim(),
      color: $("mColor").value.trim(), weight: $("mWeight").value.trim(),
      description: $("mDesc").value.trim(), isActive: true,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    try {
      if (p) await db.collection("wholesale_products").doc(p.docId).set(data, { merge: true });
      else {
        data.is_new = true;
        await db.collection("wholesale_products").add(data);
      }
    } catch (err) { return toast(err.message); }
    $("modal").classList.add("hidden");
    toast("Đã lưu hàng");
  };
  const del = $("delP");
  if (del) del.onclick = async () => {
    if (!confirm("Xóa hàng này trên Firebase?")) return;
    await db.collection("wholesale_products").doc(p.docId).delete();
    $("modal").classList.add("hidden");
  };
}

      });
      const order = {

function parseThousand(text) {
  const digits = String(text).replace(/[^\d]/g, "");
  return digits ? parseInt(digits, 10) * 1000 : 0;
}
function parseTxt(text) {
  const invoices = [];
  let cur = null;
  let auto = 1;
  const push = () => {
    if (!cur || !cur.lines.length) { cur = null; return; }
    const sum = cur.lines.reduce((s, l) => s + l.total, 0);
    const ok = cur.lines.every((l) => l.qty * l.price === l.total) && (!cur.expected || cur.expected === sum);
    invoices.push({ ...cur, sum, ok });
    cur = null;
  };
  for (const raw of text.replace(/^\uFEFF/, "").split(/\r?\n/)) {
    const line = raw.replace(/\s+/g, " ").trim();
    const head = line.match(/^(?:Hóa đơn|Hoa don)\s*(.*)$/i);
    if (head) {
      push();
      const tail = (head[1] || "").trim();
      let no = auto, customer = "Khách lẻ";
      const numbered = tail.match(/^(\d+)(?:\s*[-:–—]?\s*(.*))?$/);
      if (numbered) { no = parseInt(numbered[1], 10); customer = (numbered[2] || "").trim() || "Khách lẻ"; }
      else if (tail) customer = tail.replace(/^(?:gửi|gui|khách|khach|cho)\s+/i, "").trim();
      auto = Math.max(auto + 1, no + 1);
      cur = { no, title: "Hóa đơn " + no, customer, lines: [], expected: 0 };
      continue;
    }
    if (!cur) continue;
    const total = line.match(/^(?:Tổng hóa đơn|Tong hoa don)(?:\s+\d+)?\s*:\s*([\d.,]+)/i);
    if (total) { cur.expected = parseThousand(total[1]); continue; }
    if (!line || /^sản phẩm|^san pham/i.test(line)) continue;
    const tokens = line.split(" ");
    const nums = tokens.map((t, i) => /^\d+(?:[.,]\d+)?$/.test(t) ? i : -1).filter((i) => i >= 0);
    if (nums.length >= 3) {
      const iQty = nums[nums.length - 3];
      const name = tokens.slice(0, iQty).join(" ").trim();
      if (!name) continue;
      const qty = parseFloat(tokens[iQty].replace(",", ".")) || 0;
      const price = parseThousand(tokens[nums[nums.length - 2]]);
      const lineTotal = parseThousand(tokens[nums[nums.length - 1]]);
      cur.lines.push({ name, qty, price, total: lineTotal });
    }
  }
  push();
  return invoices;
}
